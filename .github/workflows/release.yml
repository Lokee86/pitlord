name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "0.1.3"
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: linux-x86_64
            exe: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: windows-x86_64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - id: release
        shell: bash
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Test and build
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go test ./... -count=1
          mkdir -p package
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "package/pitlord${{ matrix.exe }}" ./cmd/pitlord
          cp LICENSE.md LICENSING.md package/
      - name: Package
        shell: python
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import os
          output = Path("pitlord-{}-{}.zip".format(os.environ["VERSION"], os.environ["TARGET"]))
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(Path("package").iterdir()):
                  archive.write(path, path.name)
      - uses: actions/upload-artifact@v6
        with:
          name: pitlord-${{ matrix.target }}
          path: pitlord-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - id: release
        shell: bash
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          version="${version#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
      - name: Create checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "Pitlord ${VERSION}" --generate-notes
          fi
