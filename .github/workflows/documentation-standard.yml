name: Documentation Standard

on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check documentation structure
        run: python .standards/docs_policy/check.py --repo .
      - name: Check documentation impact
        if: github.event_name == 'pull_request'
        run: python .standards/docs_policy/check.py --repo . --changed-from "${{ github.event.pull_request.base.sha }}"
      - name: Enforce repository documentation policy
        run: go run ./cmd/pitlord check --repo . --policy .standards/policies/documentation-core.json
